[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blackscan"
version = "0.2.0"
description = "Authorized network discovery, port scanning, service fingerprinting, and lightweight exposure reporting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "BlackScan contributors" }]
dependencies = []
keywords = ["network-scanner", "security", "reconnaissance", "pentest", "reporting"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]

[project.optional-dependencies]
mysql = ["mysql-connector-python>=8.0.0"]
ssh = ["paramiko>=3.4.0"]
http = ["aiohttp>=3.9.0"]
audit = [
  "aiohttp>=3.9.0",
  "mysql-connector-python>=8.0.0",
  "paramiko>=3.4.0",
]
dev = ["pytest>=8.0.0", "ruff>=0.5.0"]

[project.scripts]
blackscan = "scanner:main"

[tool.setuptools]
py-modules = ["scanner"]

[tool.setuptools.packages.find]
include = ["network_scanner*"]

[tool.ruff]
line-length = 120
target-version = "py310"
