[project]
name = "blackscan"
version = "0.3.0"
description = "Network vulnerability scanner with exploitation capabilities"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Aegon", email = "aegon@blackscan.dev"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
blackscan = "network_scanner.scanner.main:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
]
audit = [
    "paramiko>=3.0.0",
    "aiohttp>=3.8.0",
    "mysql-connector-python>=8.0.0",
    "redis>=5.0.0",
]
all = [
    "paramiko>=3.0.0",
    "aiohttp>=3.8.0",
    "mysql-connector-python>=8.0.0",
    "redis>=5.0.0",
    "ruff>=0.1.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/Aegon/BlackScan"
Repository = "https://github.com/Aegon/BlackScan"
Issues = "https://github.com/Aegon/BlackScan/issues"